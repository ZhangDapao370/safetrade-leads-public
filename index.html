<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SafeTrade 新币公告、项目官网和项目方联系方式的公开只读列表。">
    <meta property="og:title" content="SafeTrade 新币线索台">
    <meta property="og:description" content="公开只读的新币公告与项目方入口，每天自动更新。">
    <meta property="og:image" content="https://zhangdapao370.github.io/safetrade-leads-public/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <title>SafeTrade 新币线索台</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">ST</div>
          <div>
            <h1>SafeTrade 新币线索台</h1>
            <p>公开公告与项目方入口</p>
          </div>
        </div>
        <div class="header-actions">
          <span class="readonly-badge" aria-label="公开只读版本">🔒 公开只读版</span>
          <span class="sync-state" id="sync-state">最近同步：正在读取</span>
          <a class="secondary-button" href="data/leads.json" target="_blank" rel="noreferrer">查看 AI 数据</a>
          <button class="primary-button" id="copy-endpoint" type="button">复制 AI 接口</button>
        </div>
      </header>

      <section class="stat-strip" aria-label="线索概览">
        <div><span>全部线索</span><strong id="stat-total">-</strong></div>
        <div><span>高优先级</span><strong class="accent-red" id="stat-high">-</strong></div>
        <div><span>已有联系方式</span><strong class="accent-green" id="stat-contacts">-</strong></div>
        <div><span>访问方式</span><strong class="readonly-stat">只读</strong></div>
        <p>公告时间统一按北京时间显示，旧公告更新不会被当成新币。</p>
      </section>

      <section class="workspace" aria-label="线索列表">
        <div class="workspace-heading">
          <div>
            <h2>项目线索</h2>
            <p id="result-count">正在读取公开数据</p>
          </div>
          <div class="notice hidden" id="notice" role="status"></div>
        </div>

        <div class="filterbar">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <span class="sr-only">搜索项目</span>
            <input id="search-input" type="search" placeholder="搜索项目名、代币简称或公告">
          </label>
          <div class="priority-filter" aria-label="优先级筛选">
            <button class="active" type="button" data-priority="全部">全部优先级</button>
            <button type="button" data-priority="高">高优先级</button>
            <button type="button" data-priority="中">中优先级</button>
            <button type="button" data-priority="低">低优先级</button>
          </div>
          <select id="type-filter" aria-label="公告类型筛选">
            <option value="全部">全部类型</option>
            <option value="listed">新上线</option>
            <option value="relisted">重新上线</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>项目</th>
                <th>公告类型</th>
                <th>发布时间</th>
                <th>项目方入口</th>
                <th>优先级</th>
                <th>访问权限</th>
                <th><span class="sr-only">展开</span></th>
              </tr>
            </thead>
            <tbody id="lead-table-body"></tbody>
          </table>
        </div>

        <div class="mobile-list" id="mobile-list"></div>
        <div class="empty-state hidden" id="empty-state">
          <strong>没有符合条件的线索</strong>
          <span>调整搜索词或筛选条件后再看。</span>
        </div>
      </section>
    </main>
    <noscript><p class="noscript">遇到错误：页面需要启用 JavaScript 才能读取公开数据。</p></noscript>
  </body>
</html>
